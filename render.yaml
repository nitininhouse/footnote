# Render blueprint for Footnote. Free plan: the service sleeps after ~15 idle minutes (first visit then
# takes ~1 minute) and the run history resets on each deploy to the recorded example runs (backend/seed).
services:
  - type: web
    name: footnote
    runtime: docker
    plan: free
    region: singapore
    healthCheckPath: /api/health
    envVars:
      - key: CRUSTDATA_API_KEY
        sync: false        # paste in the Render dashboard; never commit it
      - key: GEMINI_API_KEY
        sync: false
      - key: DEEPSEEK_API_KEY
        sync: false        # optional backup model
      - key: FOOTNOTE_MODE
        value: live        # recorded answers are always used first; only new lookups cost credits
      - key: DAILY_CREDIT_CAP
        value: "0"         # 0 = no daily limit
      - key: RUN_CREDIT_CAP
        value: "6"
      - key: RUNS_PER_VISITOR
        value: "0"         # 0 = no limit
